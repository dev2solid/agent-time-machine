<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Agent Time Machine: recorded branches</title><desc id="desc">Each row shows an actual recorded run, event sequence, and final decision.</desc><rect width="1080" height="600" fill="#101827"/><g font-family="monospace" fill="#e5edf7"><text x="32" y="45" font-size="25">AGENT TIME MACHINE</text><text x="32" y="76" font-size="14" fill="#9eb0c9">Record → fork a checkpoint → change one variable → compare</text><text x="32" y="128" font-size="17">Original · trusts stale metrics</text><circle cx="42" cy="162" r="7" fill="#72a7ff"/><text x="34" y="190" font-size="13">0: start</text><path d="M 42 162 H 184" stroke="#425570" stroke-width="2"/><circle cx="184" cy="162" r="7" fill="#72a7ff"/><text x="176" y="190" font-size="13">1: plan</text><path d="M 184 162 H 326" stroke="#425570" stroke-width="2"/><circle cx="326" cy="162" r="7" fill="#72a7ff"/><text x="318" y="190" font-size="13">2: retrieve</text><path d="M 326 162 H 468" stroke="#425570" stroke-width="2"/><circle cx="468" cy="162" r="7" fill="#72a7ff"/><text x="460" y="190" font-size="13">3: decide</text><text x="32" y="228" font-size="14" fill="#b8c8df">{&quot;action&quot;: &quot;investigate-latency&quot;, &quot;reason&quot;: &quot;p95 compared to 1000ms threshold&quot;}</text><text x="32" y="288" font-size="17">Instruction branch · freshness check</text><circle cx="42" cy="322" r="7" fill="#72a7ff"/><text x="34" y="350" font-size="13">0: start</text><path d="M 42 322 H 184" stroke="#425570" stroke-width="2"/><circle cx="184" cy="322" r="7" fill="#72a7ff"/><text x="176" y="350" font-size="13">1: plan</text><path d="M 184 322 H 326" stroke="#425570" stroke-width="2"/><circle cx="326" cy="322" r="7" fill="#72a7ff"/><text x="318" y="350" font-size="13">2: retrieve</text><path d="M 326 322 H 468" stroke="#425570" stroke-width="2"/><circle cx="468" cy="322" r="7" fill="#60dfb3"/><text x="460" y="350" font-size="13">3: fork</text><path d="M 468 322 H 610" stroke="#425570" stroke-width="2"/><circle cx="610" cy="322" r="7" fill="#72a7ff"/><text x="602" y="350" font-size="13">4: decide</text><text x="32" y="388" font-size="14" fill="#b8c8df">{&quot;action&quot;: &quot;request-fresh-metrics&quot;, &quot;reason&quot;: &quot;Evidence is older than 10 minutes&quot;}</text><text x="32" y="448" font-size="17">Tool branch · fresh evidence</text><circle cx="42" cy="482" r="7" fill="#72a7ff"/><text x="34" y="510" font-size="13">0: start</text><path d="M 42 482 H 184" stroke="#425570" stroke-width="2"/><circle cx="184" cy="482" r="7" fill="#72a7ff"/><text x="176" y="510" font-size="13">1: plan</text><path d="M 184 482 H 326" stroke="#425570" stroke-width="2"/><circle cx="326" cy="482" r="7" fill="#60dfb3"/><text x="318" y="510" font-size="13">2: fork</text><path d="M 326 482 H 468" stroke="#425570" stroke-width="2"/><circle cx="468" cy="482" r="7" fill="#72a7ff"/><text x="460" y="510" font-size="13">3: retrieve</text><path d="M 468 482 H 610" stroke="#425570" stroke-width="2"/><circle cx="610" cy="482" r="7" fill="#72a7ff"/><text x="602" y="510" font-size="13">4: decide</text><text x="32" y="548" font-size="14" fill="#b8c8df">{&quot;action&quot;: &quot;investigate-latency&quot;, &quot;reason&quot;: &quot;p95 compared to 1000ms threshold&quot;}</text></g></svg>